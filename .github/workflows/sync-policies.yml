# Keeps the site in sync with the Shopify store daily:
#  - policies word-for-word (required by law — see redirects-map.md "Policies")
#  - the full product range per category page: titles, photos, prices
# When anything changes on the store, the updated pages are committed and
# Vercel redeploys from the push. sync-policies.js exits non-zero if a page
# can't be fetched or fails word-for-word verification, which fails this job
# so nothing partial is ever published.
name: Sync policies and catalogue from Shopify

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC (~3:17 AM Mountain)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync policy text
        run: node tools/sync-policies.js
      - name: Sync product catalogue
        run: node tools/sync-catalogue.js
      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "shopify-sync-bot"
          git config user.email "actions@github.com"
          git add -- *.html
          git commit -m "Sync policies and product catalogue from Shopify"
          git push
