# Keeps the legal pages word-for-word in sync with the Shopify store's policies
# (required by law — see redirects-map.md "Policies" section). Runs daily; when
# the store's policy text changes, the updated pages are committed and Vercel
# redeploys from the push. sync-policies.js exits non-zero if a page can't be
# fetched or fails word-for-word verification, which fails this job so nothing
# partial is ever published.
name: Sync policies from Shopify

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC (~3:17 AM Mountain)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync policy text
        run: node tools/sync-policies.js
      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Policies unchanged."
            exit 0
          fi
          git config user.name "policy-sync-bot"
          git config user.email "actions@github.com"
          git add -- *.html
          git commit -m "Sync policy text from Shopify (word-for-word)"
          git push
